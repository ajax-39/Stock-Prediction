# Spark configuration defaults for Reliance BDA Platform
spark.master                     spark://hadoop-master:7077
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://hadoop-master:9000/spark-logs
spark.history.fs.logDirectory    hdfs://hadoop-master:9000/spark-logs
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.sql.warehouse.dir          hdfs://hadoop-master:9000/user/hive/warehouse
spark.driver.memory              2g
spark.executor.memory            2g
